<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloxxer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=Silkscreen&display=swap">
<style>
/* Layout: the game frame alone, centred. Title-screen settings and the controls line live inside the frame. */
:root {
  --void: #08070c;
  --frame: #26222f;
  --ink: #ece3d3;
  --dim: #8a849a;
  --torch: #f0a24a;
  --rune: #7fe8f0;
  --pixel: "Silkscreen", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--pixel);
  display: grid;
  place-items: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
}
.stage { position: relative; line-height: 0; --u: 3px; }
#cv {
  position: relative;
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #000;
  box-shadow: 0 0 0 1px #000, 0 0 0 calc(var(--u) * 1.4) var(--frame), 0 0 0 calc(var(--u) * 2.8) #000;
}
.pvwrap { position: absolute; left: 0; top: 0; overflow: hidden; background: #000; }
.pvwrap[hidden] { display: none; }
#pvc { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; image-rendering: crisp-edges; will-change: transform; }
.hud {
  position: absolute; left: calc(var(--u) * 6); top: calc(var(--u) * 5); pointer-events: none;
  font-size: max(12px, calc(var(--u) * 6)); line-height: 1; letter-spacing: .06em;
  text-shadow: 0 calc(var(--u) * .5) 0 #000, 0 0 calc(var(--u) * 3) #000;
}
.hud[hidden], .keys[hidden], .settings[hidden], .binds[hidden] { display: none; }
.keys {
  position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 5);
  display: flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--u) * 2) calc(var(--u) * 7);
  font-size: max(11px, calc(var(--u) * 4.2)); line-height: 1.2; letter-spacing: .04em;
  color: var(--dim); text-shadow: 0 1px 0 #000, 0 0 8px #000; pointer-events: none;
  padding-inline: calc(var(--u) * 4);
}
.keys b { color: var(--ink); font-weight: 400; margin-right: .5em; }
.settings {
  position: absolute; left: calc(var(--u) * 6); top: calc(var(--u) * 5);
  display: grid; gap: calc(var(--u) * 3); justify-items: start;
  font-size: max(11px, calc(var(--u) * 4.4)); line-height: 1.15; letter-spacing: .06em;
}
.settings button {
  font: inherit; letter-spacing: inherit; color: var(--dim); background: none; border: 0; padding: 0;
  cursor: pointer; text-shadow: 0 1px 0 #000;
}
.settings button:hover, .settings button:focus-visible { color: var(--ink); outline: none; }
.binds { display: grid; gap: calc(var(--u) * 2.5); padding: calc(var(--u) * 4) calc(var(--u) * 5); background: #0b0a10e6; box-shadow: 0 0 0 1px #3a3446; }
.binds button { display: flex; justify-content: space-between; gap: calc(var(--u) * 10); min-width: calc(var(--u) * 70); }
.binds button b { font-weight: 400; color: var(--ink); }
.binds button.listen b { color: var(--torch); }
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="pvwrap" id="pvwrap" hidden><canvas id="pvc" width="320" height="192"></canvas></div>
  <canvas id="cv" width="320" height="192" aria-label="Game screen"></canvas>
  <div class="keys" id="keys"></div>
  <div class="settings" id="settings">
    <button type="button" id="setBtn">SETTINGS</button>
    <div class="binds" id="binds" hidden>
      <button type="button" data-bind="jump"><span>JUMP</span><b></b></button>
      <button type="button" data-bind="grab"><span>GRAB / THROW</span><b></b></button>
      <button type="button" data-bind="drop"><span>PUT DOWN</span><b></b></button>
      <button type="button" data-bind="bash"><span>SHIELD BASH</span><b></b></button>
      <button type="button" id="soundBtn"><span>SOUND</span><b></b></button>
    </div>
  </div>
  <div class="hud" id="hud" hidden>LEVEL 1</div>
</main>

<script>
(() => {
  'use strict';
  const W = 320, H = 192, T = 16, ROWS = 12;
  // a room is one screen wide unless its map is wider; then the camera follows the knight
  let COLS = 20, WW = W, camX = 0;
  const G = 0.3, JUMP = 3.95, RUN = 1.5, RUN_CARRY = 1.3, MAXFALL = 5, PUSH = 0.7;
  const DASH_T = 11, DASH_V = 3.4, KICK_V = 3.8;
  const CRUMBLE_T = 40, SPRING_V = 6, BAT_V = 0.8, BELT_V = 0.6;
  const PW = 10, PH = 12;

  // #  stone              -  wooden ledge (stand on it, jump up through it)
  // ^  spikes             <  >  arrow trap firing left / right
  // a  b  pressure plates; A  B  the portcullis each one holds open
  // !  lever: opens every T gate for the level's timer, then they slam shut
  // x  cracked stone: a shield bash shatters the whole column of it
  // ~  crumbling stone: gives way soon after the knight or a crate stands on it; the floating rune block weighs nothing
  // s  spring: launches the knight about four tiles up; a crate parked on it holds it down
  // {  }  conveyor floor rolling left / right: it carries the knight, crates and mobs, never the floating rune block
  // X  the way out        P  knight   c  crate   r  rune block (floats)   E  slime   g  beetle (stomp or bash it)
  // v  bat: flies back and forth along its row; stomp it for a bounce in mid-air, or bash it
  const LEVELS = [
    // 1: carry the crate to the wall and climb it

    // 2: the crate has to hold the plate
    { map: [

    { map: [

      '#...........#..#...#',

      '#...........#..#...#',

    { period: 90, map: [

      '#..................#',
      '#..................#',

    // 5: lift the crate off the spring, ride the spring up carrying it between arrows, and use it to climb the wall
    { period: 90, map: [

      '#..................#',

      '#..................#',
      '#..................#',
      '#..................#',
      '#.............#....#',
      '>.............#.X..#',
      '#.......############',

      '#..................#',

      '#............#.#...#',

    { map: [

      '#..................#',

      '######......########'] },
    // 10: the belt drags the crate off the plate toward the pit; the rune block doesn't ride belts, so it can stop it
    { map: [

      '#.............#....#',
      '#.............#....#',
      '#.............#....#',
      '#.............A....#',

      '#####}}}}}}}..######'] },
    // 11: the lever starts the clock: pull it when the bat is where you'll need it, bounce off it over the pit,

    { timer: 230, map: [

      '#................#.#',

      '######......########'] },
    // 12: the belt runs everything back downhill: the rune block holds the crates against the ledge and is the first step;
    //     the arrows find you while you stand on it
    { period: 90, map: [
      '####################',
      '#..................#',

      '#####{{{{{{{{{######'] },
    // 13: the gate is too far from the lever to make it by hand: ride the crate up the spring past the bat, set it on
    //     the belt, a slow fuse into the lever, and be waiting at the gate when it gets there
    { timer: 110, map: [
      '####################',
      '#...............#..#',
      '#...............#..#',
      '#...............#..#',
      '#...............#..#',
      '#...............#..#',
      '#...............#..#',
      '#!..............#..#',
      '#{{{{{{{{{{{{...T..#',
      '#.......v.......T..#',
      '#.P...c.......s.T.X#',
      '####################'] },
    // 14: hold the door with the crate (the rune keeps it on the belt's plate), then spring onto the crumbling ledge
    //     and take its spring up before the ledge gives way, minding the bat that sweeps across it
    { map: [
      '####################',
      '#...............#..#',
      '#...............#..#',
      '#...............#..#',
      '#...............#..#',
      '#...............A.X#',
      '#.....##############',
      '#.v.s.#............#',
      '#..~~..............#',
      '#..................#',
      '#s.P..a.r..c.......#',
      '#####}}}}}}}}}######'] },
    // 15: the long way out, three rooms wide: squash the slime and push the crate onto the plate, bash the beetle and the
    //     cracked wall, bounce off the bat over the pit, stop the crate on the belt's plate with the rune, pull the lever
    //     and sprint the crumbling bridge to the gate, then spring up to the way out
    { timer: 180, map: [
      '############################################################',
      '#..........#.......#.....................#..........#......#',
      '#..........#.......#.....................#..........#......#',
      '#..........#.......#.....................#..........#......#',
      '#..........#.......#.....................#..........#......#',
      '#..........#.......#.....................#..........#......#',
      '#..........#.......#.....................#..........#......#',
      '#..........#.......#.....................#..........#....X.#',
      '#..........A.......#.....................#..........T...####',
      '#..........A.......x.....................B..........T...####',
      '#.P.c...E.aA...g...x.#v.....#cr.....b....B!.........T.s.####',
      '######################......###}}}}}}}..####~~~.~~~#########'] }
  ];

  const cv = document.getElementById('cv');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx;
  const $ = id => document.getElementById(id);
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const hash = (a, b, s) => { let h = (a * 374761393 + b * 668265263 + (s || 0) * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  // a soft pool of light (or of darkness cut away): full strength at the centre, `mid` of it halfway out, nothing at the edge
  function ring(c2d, x, y, r, rgb, a, mid) {
    const g = c2d.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')');
    g.addColorStop(0.5, 'rgba(' + rgb + ',' + a * (mid == null ? 0.6 : mid) + ')');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    c2d.fillStyle = g; c2d.fillRect(x - r, y - r, r * 2, r * 2);
  }

  // ---------- save ----------
  const SAVE_KEY = 'bloxxer-v1';
  let save = { level: 0, deaths: 0, time: 0, muted: false };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s.level === 'number') save = Object.assign(save, s); } catch (e) {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

  // ---------- audio ----------
  // One context, woken by the first click or key; everything goes through a limiter and is
  // scheduled slightly ahead so a slow frame never makes a sound start late.
  let ac = null, master = null, musicBus = null, noiseBuf = null;
  function audioInit() {
    if (!ac) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        ac = new AC({ latencyHint: 'interactive' });
        const limiter = ac.createDynamicsCompressor();
        limiter.threshold.value = -12; limiter.knee.value = 10; limiter.ratio.value = 8;
        limiter.attack.value = 0.002; limiter.release.value = 0.15;
        master = ac.createGain(); master.gain.value = save.muted ? 0 : 0.7;
        master.connect(limiter); limiter.connect(ac.destination);
        musicBus = ac.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; return; }
    }
    if (ac.state !== 'running') ac.resume().catch(() => {});
  }
  ['pointerdown', 'mousedown', 'keydown', 'touchend'].forEach(ev => addEventListener(ev, audioInit, { capture: true, passive: true }));
  const live = () => ac && !save.muted && ac.state === 'running';
  function tone(f, dur, type, vol, slide, delay) {
    if (!live()) return;
    const t = ac.currentTime + 0.025 + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, delay) {
    if (!live()) return;
    const t = ac.currentTime + 0.025 + (delay || 0);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5, dur + 0.05);
  }
  const SFX = {
    jump: () => tone(330, 0.08, 'square', 0.022, 240),
    land: () => noise(0.05, 0.05, 500),
    step: () => noise(0.02, 0.012, 900),
    grab: () => { noise(0.06, 0.05, 700); tone(180, 0.07, 'square', 0.025, 60); },
    throw: () => { noise(0.12, 0.05, 2200); tone(500, 0.1, 'triangle', 0.025, -250); },
    put: () => { tone(150, 0.06, 'square', 0.03, -40); noise(0.04, 0.04, 600); },
    thud: () => { tone(95, 0.14, 'square', 0.05, -40); noise(0.09, 0.08, 450); },
    scrape: () => noise(0.05, 0.018, 380),
    rune: () => { tone(880, 0.25, 'sine', 0.035, 440); tone(1320, 0.18, 'sine', 0.018, 0, 0.04); },
    runeStop: () => { tone(1760, 0.14, 'sine', 0.03); tone(1318, 0.2, 'triangle', 0.02, 0, 0.03); },
    plateOn: () => { tone(220, 0.05, 'square', 0.03); tone(440, 0.05, 'square', 0.02, 0, 0.03); },
    plateOff: () => { tone(330, 0.05, 'square', 0.02); tone(165, 0.06, 'square', 0.025, 0, 0.03); },
    doorUp: () => { noise(0.3, 0.04, 260); tone(70, 0.3, 'sawtooth', 0.025, 30); },
    slam: () => { tone(60, 0.25, 'square', 0.06, -20); noise(0.2, 0.1, 350); tone(900, 0.06, 'square', 0.015, 0, 0.02); },
    lever: () => { tone(600, 0.04, 'square', 0.03); noise(0.05, 0.05, 1500); tone(300, 0.08, 'square', 0.03, 0, 0.04); },
    tick: () => tone(1500, 0.03, 'square', 0.018),
    tock: () => tone(1100, 0.03, 'square', 0.018),
    fire: () => { tone(700, 0.1, 'triangle', 0.035, -450); noise(0.06, 0.03, 3000); },
    arrowWood: () => { tone(260, 0.06, 'square', 0.03, -80); noise(0.04, 0.05, 1200); },
    arrowStone: () => { tone(2400, 0.05, 'square', 0.015); noise(0.04, 0.04, 4000); },

    splinter: () => { noise(0.3, 0.1, 900); tone(120, 0.2, 'square', 0.04, -60); },
    die: () => { tone(280, 0.35, 'sawtooth', 0.04, -200); noise(0.25, 0.07, 700); tone(1800, 0.08, 'square', 0.015, -600, 0.02); tone(1250, 0.4, 'triangle', 0.03, 0, 0.05); tone(1870, 0.3, 'sine', 0.02, 0, 0.05); },
    nope: () => tone(110, 0.1, 'square', 0.03),
    clear: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.028, 0, i * 0.075)),
    select: () => tone(880, 0.05, 'square', 0.02),
    flap: () => noise(0.04, 0.015, 1800),
    creak: () => { noise(0.25, 0.04, 300); tone(70, 0.2, 'square', 0.02, -20); },
    spring: () => { tone(180, 0.18, 'square', 0.035, 700); tone(360, 0.12, 'triangle', 0.02, 900, 0.03); },
    crumble: () => { noise(0.35, 0.1, 380); tone(80, 0.25, 'square', 0.045, -35); noise(0.2, 0.05, 1500, 0.08); },
    stomp: () => { tone(160, 0.1, 'square', 0.05, -70); noise(0.08, 0.07, 1100); tone(700, 0.08, 'square', 0.02, 400, 0.02); },
    skitter: () => noise(0.03, 0.012, 3200),
    bash: () => { noise(0.14, 0.06, 1600); tone(260, 0.1, 'square', 0.025, -120); },
    kick: () => { tone(120, 0.12, 'square', 0.06, -50); noise(0.1, 0.09, 700); tone(520, 0.05, 'square', 0.02, 0, 0.01); },
    bonk: () => { tone(400, 0.08, 'square', 0.03, -200); tone(1500, 0.05, 'square', 0.012); },
    clang: () => { tone(2200, 0.18, 'square', 0.02, -300); tone(1500, 0.25, 'triangle', 0.025); },
    stepHeavy: () => { noise(0.04, 0.02, 600); tone(110, 0.04, 'square', 0.012); },
    landWood: () => { tone(180, 0.06, 'square', 0.03, -60); noise(0.04, 0.04, 900); },
    runeGrab: () => { tone(1320, 0.12, 'sine', 0.03); tone(1760, 0.16, 'sine', 0.02, 0, 0.05); },
    bump: () => { tone(130, 0.08, 'square', 0.04, -40); noise(0.05, 0.06, 600); },

    [[0, 'D5', 2], [2, 'F5', 2], [4, 'A5', 3], [7, 'G5', 1], [8, 'F5', 2], [10, 'E5', 2], [12, 'D5', 4]],
    [[0, 'D5', 2], [2, 'F5', 2], [4, 'Bb5', 3], [7, 'A5', 1], [8, 'G5', 4], [12, 'F5', 4]],
    [[0, 'C5', 2], [2, 'F5', 2], [4, 'A5', 2], [6, 'G5', 2], [8, 'F5', 2], [10, 'A5', 2], [12, 'C5', 4]],
    [[0, 'E5', 3], [3, 'F5', 1], [4, 'G5', 4], [8, 'E5', 2], [10, 'D5', 2], [12, 'C5', 4]]
  ];

    [[0, 'G5', 4], [4, 'F5', 2], [6, 'D5', 2], [8, 'Bb4', 4], [12, 'D5', 4]],
    [[0, 'A5', 4], [4, 'F5', 2], [6, 'D5', 2], [8, 'A4', 8]],
    [[0, 'Bb4', 2], [2, 'D5', 2], [4, 'F5', 2], [6, 'Bb5', 2], [8, 'A5', 4], [12, 'G5', 4]],
    [[0, 'E5', 4], [4, 'Cs5', 4], [8, 'A4', 4], [12, 'E5', 4]]

  // ---------- input ----------
  // Jump, grab, put-down and bash can be rebound to a key or mouse button in the title-screen settings; the rest stay put.
  const FIXED = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump',
    ArrowDown: 'drop', KeyR: 'restart', Enter: 'confirm', Escape: 'menu'

    if (/^Mouse\d$/.test(c)) return 'MOUSE ' + c.slice(5);
    if (/^Key.$/.test(c)) return c.slice(3);
    if (/^Digit.$/.test(c)) return c.slice(5);
    const arrows = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→' };
    if (arrows[c]) return arrows[c];

    }
    if (carry && p.vy >= 0 && !onGround(p) && blockedAt(p, p.x, p.y + 1)) slipCarry();

    if (p.ground && p.vy > 0) p.vy = 0;

    if (p.squash > 0) p.squash--; else if (p.squash < 0) p.squash++;
    p.walk = p.ground && ax ? p.walk + 1 : 0;
    if (p.walk && p.walk % (carry ? 14 : 12) === 6) sfx(carry ? 'stepHeavy' : 'step');
    if (p.throwT > 0) p.throwT--;
    if (pressed.grab && !p.dashT) grab();
    if (pressed.drop) putDown();
    if (carry && carry.lift < 1) carry.lift = Math.min(1, carry.lift + 0.2);

  }

  // ---------- the dungeon's machinery ----------
  const bodies = () => { const list = blocks.filter(b => !b.dead); if (mode !== 'dead') list.push(p); return list; };
  function updateMachines() {
    // plates
    const was = Object.assign({}, plateState);
    plateState = {};
    // a plate only counts something actually standing on it: resting on the floor there, centred over the plate;
    // the floating rune block weighs nothing, so it never holds one down
    const onPlate = (pl, o) => { const cx = o.x + o.w / 2, foot = o.y + o.h; return cx > pl.c * T + 1 && cx < pl.c * T + T - 1 && foot > (pl.r + 1) * T - 2 && foot <= (pl.r + 1) * T + 0.5; };
    for (const pl of plates) {
      pl.on = bodies().some(o => o !== carry && o.kind !== 'rune' && onPlate(pl, o));
      pl.sink += ((pl.on ? 2 : 0) - pl.sink) * 0.4;
      if (pl.on) plateState[pl.ch] = true;
    }
    for (const ch of ['a', 'b']) if (!!was[ch] !== !!plateState[ch] && plates.some(pl => pl.ch === ch)) sfx(plateState[ch] ? 'plateOn' : 'plateOff');
    // crumbling stone starts to go the moment real weight lands on it (a crate bears down on the tile under its middle), and nothing stops it after that
    const weighty = blocks.filter(b => !b.dead && b !== carry && b.kind === 'crate');
    if (mode === 'play' && p.ground) weighty.push(p);
    for (const cr of crumbles) {
      if (cr.gone) continue;
      if (!cr.t && weighty.some(o => { const foot = o.y + o.h, cx = o.x + o.w / 2; return foot > cr.r * T - 1.01 && foot <= cr.r * T + 0.5 && (o === p ? o.x < cr.c * T + T && o.x + o.w > cr.c * T : cx >= cr.c * T && cx < cr.c * T + T); })) { cr.t = 1; sfx('creak'); }
      else if (cr.t && ++cr.t >= CRUMBLE_T) {

    // conveyors carry whatever stands on them, judged by the middle of its feet
    const beltUnder = o => { const ch = tileAt(Math.floor((o.x + o.w / 2) / T), Math.floor((o.y + o.h + 0.5) / T)); return ch === '{' ? -1 : ch === '}' ? 1 : 0; };
    if (mode === 'play' && p.ground && !p.dashT) { const d = beltUnder(p); if (d) { moveAxis(p, d * BELT_V, 'x'); if (carry) { const cb = carryBox(p.x, p.y); carry.x = cb.x; carry.y = cb.y; } } }

    }
    for (const sl of slimes) if (sl.alive && !sl.fly && blockedAt(sl, sl.x, sl.y + 1)) { const d = beltUnder(sl); if (d) moveAxis(sl, d * BELT_V, 'x'); }

      if (sp.held || mode !== 'play' || !p.ground || p.dashT) continue;
      const cx = p.x + PW / 2, foot = p.y + PH;
      if (cx > sp.c * T + 1 && cx < sp.c * T + T - 1 && Math.abs(foot - (sp.r + 1) * T) < 1.01) {

      else if (d.amt > 0) {

        }
        if (d.amt === 0 && (tileAt(d.c, d.r + 1) !== d.ch)) { sfx('slam'); shake = Math.max(shake, 3); dust(d.c * T + 8, d.r * T + T, 4); }
      }
    }
    if (doors.some(d => d.sound)) { sfx('doorUp'); for (const d of doors) d.sound = false; }
    if (doors.some(d => d.clunk)) { sfx('clunk'); for (const d of doors) d.clunk = false; }

      tr.warn = t2 > period - 26 ? (t2 - (period - 26)) / 26 : 0;

        if (hitB) { sfx('arrowWood'); burst(tipX, a.y, 5, WOOD, 1, { angle: a.dir > 0 ? Math.PI : 0, spread: 1.5, life: 18 }); a.on = hitB; a.ox = a.x - hitB.x; a.oy = a.y - hitB.y; }
        else { sfx('arrowStone'); burst(tipX, a.y, 6, ['#ffe2a0', '#ffffff', '#c8b080'], 1.3, { angle: a.dir > 0 ? Math.PI : 0, spread: 1.6, life: 12, g: 0.05 }); }

      }
      if (!a.whizzed && mode === 'play' && Math.abs(a.x + 4 - p.x - 5) < 24 && Math.abs(a.y - p.y - 6) < 20) { a.whizzed = true; sfx('whiz'); }
      if (p.dashT > 0 && !a.deflected && overlap(hb, { x: p.x - 3, y: p.y, w: PW + 6, h: PH })) {
        a.dir = -a.dir; a.deflected = true; sfx('clang');

  function updateSlimes() {
    for (const s of slimes) {

        const sp = s.type === 'beetle' ? 0.5 : 0.65;

  function killMob(s) {

    else if (s.type === 'beetle') { burst(s.x + 6, s.y + 4, 18, ['#5b4a86', '#8f7cc4', '#2e2448', '#ffc93a'], 1.6, { life: 30, g: 0.12, chip: true }); sfx('stomp'); }
    else { burst(s.x + 6, s.y + 6, 24, ['#7fd36a', '#bfe8b0', '#4f9e4a', '#2f6634'], 1.8, { life: 34, g: 0.1 }); sfx('squish'); }

  function die() {

  function checkWorld() {

    for (let r = Math.floor(pb.y / T); r <= Math.floor((pb.y + pb.h) / T); r++) for (let c = Math.floor(pb.x / T); c <= Math.floor((pb.x + pb.w) / T); c++) if (spiky(c, r)) return die();

  // ---------- step ----------
  let keepInput = false, exitNear = false;
  function stepPlay() {
    if (pressed.restart && mode !== 'clear') { respawn(); return; }
    if (pressed.menu) { scene = 'title'; return; }
    if (hitstop > 0) { hitstop--; keepInput = true; return; }
    if (mode === 'play') {
      updatePlayer(); updateBlocks(); updateMachines(); updateSlimes();
      if (torches.length && Math.random() < 0.015) sfx('crackle');
      if (!exitNear && exits.some(e => Math.hypot(e.x + 6 - p.x - 5, e.y + 20 - p.y - 6) < 36)) { exitNear = true; sfx('shimmer'); }
      levelTime += 1 / 60; lt++;
      if (mode === 'play') checkWorld();
    } else {
      modeT++;
      updateBlocks(); updateMachines(); updateSlimes(); lt++;
      if (mode === 'dead' && modeT > 40) respawn();
      if (mode === 'clear' && modeT > 60) {
        if (levelIdx + 1 >= LEVELS.length) scene = 'end';
        else loadLevel(levelIdx + 1, true);
      }
    }
  }
  function step() {
    keepInput = false;
    if (scene === 'title') stepTitle();
    else if (scene === 'end') { if (pressed.confirm || pressed.grab) { scene = 'title'; sfx('select'); } }
    else stepPlay();
    if (scene === 'play') {
      if (irisDir > 0) { iris = Math.min(1, iris + 0.045); if (iris >= 1) irisDir = 0; }
      else if (irisDir < 0) iris = Math.max(0, iris - 0.035);
    }

    updateParticles();
    if (shake > 0) shake -= 0.5;
    if (flashT > 0) flashT--;
    music();
    tick++;
    if (!keepInput) for (const a in pressed) pressed[a] = false;
  }

  // ---------- title ----------
  const menuItems = () => save.level > 0 && save.level < LEVELS.length ? ['CONTINUE', 'NEW GAME'] : ['NEW GAME'];
  function stepTitle() {
    if (++pvT >= PV_LEN) startPreview(pvIdx + 1);
    if (settingsOpen) return;
    const items = menuItems();
    if (menuSel >= items.length) menuSel = 0;
    if (items.length > 1 && (pressed.jump || pressed.drop)) { menuSel = (menuSel + (pressed.jump ? items.length - 1 : 1)) % items.length; sfx('select'); }
    if (pressed.confirm || pressed.grab) {
      sfx('start');
      if (items[menuSel] === 'NEW GAME') { save.level = 0; save.deaths = 0; save.time = 0; persist(); }
      scene = 'play';
      syncScene();
      loadLevel(Math.min(save.level, LEVELS.length - 1), true);
    }
  }
  let lastPlay = false;
  function syncScene() {
    if (scene === lastScene) return;
    lastScene = scene;
    $('hud').hidden = scene !== 'play';
    $('keys').hidden = scene !== 'title';
    $('settings').hidden = scene !== 'title';
    $('pvwrap').hidden = scene !== 'title';
    cv.style.background = scene === 'title' ? 'transparent' : '#000';
    if (scene !== 'title' && settingsOpen) openSettings(false);
    if (scene === 'title' && lastPlay) startPreview(pvIdx);
    lastPlay = scene !== 'title';
  }

  // ---------- baking ----------
  function bakeBackground() {
    const b = bgLayer.getContext('2d');
    const f = (c, x, y, w, h) => { b.fillStyle = c; b.fillRect(x, y, w, h); };
    f('#15121e', 0, 0, WW, H);
    // big dungeon blocks, staggered, in two quiet tones
    for (let row = 0; row < H / 12; row++) {
      const y = row * 12, off = (row % 2) * 12;
      for (let x = -off; x < WW; x += 24) {
        const v = hash(Math.floor((x + 100) / 24), row, levelIdx);
        const col = v < 0.5 ? '#1a1726' : '#1d1a2a';
        f(col, x + 1, y + 1, 22, 10);
        f('#121019', x + 1, y + 10, 22, 1);
      }
    }
    const v = vignette.getContext('2d');
    v.clearRect(0, 0, W, H);
    const g = v.createRadialGradient(W / 2, H / 2, 70, W / 2, H / 2, 210);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
    v.fillStyle = g; v.fillRect(0, 0, W, H);
  }

  function placeDecor() {
    torches = [];
    const open = (c, r) => tileAt(c, r) === '.' && !doorMap[r]?.[c];
    const near = (c, r, d) => exits.some(e => Math.abs(e.c - c) <= d && Math.abs(e.r - r) <= 2) || levers.some(l => Math.abs(l.c - c) <= 1 && Math.abs(l.r - r) <= 1);
    // torches on the back wall at head height and above
    const cands = [];
    for (let c = 1; c < COLS - 1; c++) for (let r = 2; r < ROWS - 2; r++) if (open(c, r) && open(c, r + 1) && open(c - 1, r) && open(c + 1, r) && !near(c, r, 1)) cands.push([c, r]);
    cands.sort((a, b) => (hash(a[0], a[1], levelIdx + 9) - hash(b[0], b[1], levelIdx + 9)) + (Math.abs(a[1] - 6) - Math.abs(b[1] - 6)) * 0.15);
    for (const [c, r] of cands) {

    }
    for (const tr of traps) if (tr.warn > 0) {
      const x = tr.dir > 0 ? tr.c * T + T - 5 : tr.c * T, y = tr.r * T + 7;
      ctx.globalAlpha = tr.warn; px('#ff5a3a', x, y, 5, 2); px('#ffd0a0', x + (tr.dir > 0 ? 4 : 0), y, 1, 2); ctx.globalAlpha = 1;
    }
  }

  function drawLighting() {
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, WW, H);
    lctx.drawImage(dark, 0, 0);
    lctx.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r, a) => ring(lctx, x, y, r, '0,0,0', a);
    for (const t2 of torches) hole(t2.x, t2.y - 2, 60 + Math.sin(tick / 5 + t2.ph) * 2 + (tick % 7 === 0 ? 2 : 0), 0.95);
    if (p && mode !== 'dead') hole(p.x + 5, p.y + 4, 46, 0.8);
    for (const b of blocks) if (!b.dead && b.kind === 'rune') hole(b.x + 8, b.y + 8, 30, 0.75);
    for (const s of slimes) if (s.alive) hole(s.x + 6, s.y + 5, 20, 0.5);
    for (const tr of traps) if (tr.warn > 0) hole(tr.c * T + 8, tr.r * T + 8, 22, tr.warn * 0.8);
    for (const lv of levers) hole(lv.x + 5, lv.y + 6, 24, 0.7);
    for (const pl of plates) hole(pl.x + 7, pl.y + 2, 18, 0.6);
    if (timer > 0) for (const d of doors) if (d.ch === 'T') hole(d.c * T + 8, d.r * T + 8, 16, 0.4);
    ctx.drawImage(lightLayer, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    const glow = (x, y, r, rgb, a) => ring(ctx, x, y, r, rgb, a, 0.5);
    for (const t2 of torches) glow(t2.x, t2.y - 2, 34 + Math.sin(tick / 4 + t2.ph) * 2, '255,130,50', 0.17);
    for (const e of exits) glow(e.c * T + 8, e.r * T + 2, 30, '190,90,255', 0.2 + 0.02 * Math.sin(tick / 40));
    for (const b of blocks) if (!b.dead && b.kind === 'rune') glow(b.x + 8, b.y + 8, 20, '110,230,240', 0.17);
    for (const pl of plates) if (pl.on) glow(pl.x + 7, pl.y + 2, 12, pl.ch === 'a' ? '240,160,70' : '180,140,255', 0.2);
    for (const tr of traps) if (tr.warn > 0) glow(tr.c * T + 8 + tr.dir * 8, tr.r * T + 8, 12, '255,90,58', 0.3 * tr.warn);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Between levels a wall of stone blocks fills the screen: on the way in it tumbles away from the
  // knight, nearest blocks first; on the way out it drops back into place, farthest first.
  function drawIris() {
    if (iris >= 1) return;
    const pc = p ? (p.x + 5 - camX) / T : W / T / 2, pr = p ? (p.y + 6) / T : ROWS / 2;
    const closing = irisDir < 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < W / T; c++) {
      const d = Math.min(1, Math.hypot(c + 0.5 - pc, r + 0.5 - pr) / 22);
      const k = Math.max(0, Math.min(1, (iris - d * 0.55) / 0.45));
      if (k >= 1) continue;
      const off = closing ? -k * k * 220 : k * k * 220;
      const x = c * T, y = Math.round(r * T + off), v = hash(c, r, 77);
      px('#09080d', x, y, T, T);
      px(v < 0.3 ? '#1f1d2b' : '#25222f', x + 1, y + 1, T - 2, T - 2);
      px('#37334a', x + 1, y + 1, T - 2, 1); px('#141219', x + 1, y + T - 2, T - 2, 1);
      if (v > 0.85) { px('#141219', x + 4, y + 5, 3, 1); px('#141219', x + 6, y + 6, 1, 3); }
    }
  }

  function drawWorld() {
    const cx = Math.round(camX);
    ctx.save(); ctx.translate(-cx, 0);
    ctx.drawImage(bgLayer, 0, 0);
    const sx = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;
    const sy = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;
    ctx.save(); ctx.translate(sx, sy);
    for (const t2 of torches) drawTorch(t2);
    for (const e of exits) drawExit(e);
    ctx.drawImage(tileLayer, 0, 0);
    for (const cr of crumbles) drawCrumble(cr);
    drawBelts();
    drawShine();
    for (const lv of levers) drawLever(lv);
    for (const pl of plates) drawPlate(pl);
    for (const sp of springs) drawSpring(sp);
    drawDoors();
    for (const b of blocks) if (!b.dead && b !== carry) drawBlock(b);
    for (const s of slimes) drawSlime(s);
    if (mode !== 'dead') { drawPlayer(); if (carry) drawBlock(carry); }
    for (const a of arrows) drawArrow(a);
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, 1 - q.life / q.max);
      if (q.chip) px(q.c, Math.round(q.x), Math.round(q.y), 2, 1);
      else px(q.c, Math.round(q.x), Math.round(q.y), q.s, q.s);
    }
    ctx.globalAlpha = 1;
    ctx.globalAlpha = 1;
    ctx.restore();
    drawLighting();
    ctx.restore();
    ctx.drawImage(vignette, 0, 0);
    if (flashT > 0) { ctx.globalAlpha = flashT / 10; px(mode === 'dead' ? '#ffd0c0' : '#ffffff', 0, 0, W, H); ctx.globalAlpha = 1; }
    drawIris();
  }

  function text(str, x, y, size, color, font, align) {
    ctx.font = size + 'px ' + (font || '"Silkscreen", monospace');
    ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000'; ctx.fillText(str, x, y + Math.max(1, Math.round(size / 12)));
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  const TITLE_FONT = '"Jacquard 24", serif';
  // The title screen: every level in turn, drawn at double size and panned slowly from left to
  // right, fading through black between them; the name and menu sit over a black fade on the left.
  const pv = $('pvc'), pvCtx = pv.getContext('2d');
  const PV_LEN = 900, PV_FADE = 60;
  // one slow, steady camera move per level, in source pixels of the double-size view: [x0, y0, x1, y1]
  const MOVES = [
    [0, 96, 160, 96],
    [160, 60, 0, 60],
    [100, 96, 100, 0],
    [0, 10, 160, 96],
    [150, 96, 10, 20],
    [40, 0, 40, 96],
    [160, 96, 0, 40],
    [0, 40, 160, 90],
    [160, 10, 0, 96],
    [20, 96, 140, 0],
    [0, 96, 160, 30],
    [160, 0, 40, 96],
    [80, 96, 80, 0],
    [0, 0, 160, 96],
    [160, 60, 0, 60]
  ];
  let pvIdx = 0, pvT = 0;
  function startPreview(i) { pvIdx = i % LEVELS.length; pvT = 0; loadLevel(pvIdx, false, true); }
  function drawTitle() {
    const main = ctx;
    ctx = pvCtx; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
    drawWorld();
    ctx = main;
    // the preview layer sits behind this canvas at double size; sliding it with a CSS transform moves it
    // by fractions of a pixel, so even a very slow pan glides instead of stepping
    const [x0, y0, x1, y1] = MOVES[pvIdx % MOVES.length], t = pvT / PV_LEN;
    const sx = x0 + (x1 - x0) * t, sy = y0 + (y1 - y0) * t;
    pv.style.transform = 'translate(' + (-sx * 2 * viewScale) + 'px,' + (-sy * 2 * viewScale) + 'px)';
    ctx.clearRect(0, 0, W, H);
    const fade = Math.min(1, pvT / PV_FADE, (PV_LEN - pvT) / PV_FADE);
    if (fade < 1) { ctx.globalAlpha = 1 - fade; px('#000', 0, 0, W, H); ctx.globalAlpha = 1; }
    const g = ctx.createLinearGradient(0, 0, 170, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.45, 'rgba(0,0,0,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (settingsOpen) ctx.globalAlpha = 0.3;
    text('Bloxxer', 22, 64, 48, '#ece3d3', TITLE_FONT, 'left');
    menuItems().forEach((it, i) => {
      const sel = i === menuSel;
      text((sel ? '> ' : '') + it + (it === 'CONTINUE' ? '  LEVEL ' + (save.level + 1) : ''), sel ? 24 : 32, 104 + i * 13, 8, sel ? '#f0a24a' : '#b8b2c8', null, 'left');
    });
    ctx.globalAlpha = 1;
  }
  function drawEnd() {
    ctx.drawImage(bgLayer, 0, 0);
    ctx.fillStyle = 'rgba(6,4,12,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ring(ctx, W / 2, 150, 160, '255,220,150', 0.25);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(vignette, 0, 0);
    text('Daylight', W / 2, 58, 48, '#ffe2a0', TITLE_FONT);
    const t = save.time, m = Math.floor(t / 60), s = Math.floor(t % 60).toString().padStart(2, '0');
    text('DEATHS ' + save.deaths + '     TIME ' + m + ':' + s, W / 2, 100, 8, '#ece3d3');
    const bx = W / 2 - 8, by = 140;
    ctx.drawImage(CRATE, bx, by);
    const hop = Math.abs(Math.sin(tick / 12)) * 6;
    ctx.drawImage(PF[(hop > 1 ? 'jump' : 'stand') + 'idle0'][0], bx, Math.round(by - 19 - hop));
  }
  function draw() {
    syncScene();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    if (scene === 'title') drawTitle();
    else if (scene === 'end') drawEnd();
    else drawWorld();
  }

  function fit() {
    const avail = innerWidth - 32;
    const maxH = Math.max(200, innerHeight - 40);
    let s = Math.min(avail / W, maxH / H);
    if (s >= 2) s = Math.floor(s * 2) / 2;
    cv.style.width = Math.floor(W * s) + 'px';
    cv.style.height = Math.floor(H * s) + 'px';
    $('stage').style.setProperty('--u', s + 'px');
    viewScale = s;
    $('pvwrap').style.width = cv.style.width; $('pvwrap').style.height = cv.style.height;
    pv.style.width = W * 2 * s + 'px'; pv.style.height = H * 2 * s + 'px';
  }
  let viewScale = 3;
  addEventListener('resize', fit);

  // ---------- boot ----------
  const STEP_MS = 1000 / 60;
  let acc = 0, last = performance.now();
  const api = { manual: false };
  function frame(now) {
    acc += Math.min(100, now - last); last = now;
    if (!api.manual) while (acc >= STEP_MS) { step(); acc -= STEP_MS; }
    else acc = 0;
    draw();
    requestAnimationFrame(frame);
  }
  // test hook: drive the game one frame at a time
  Object.assign(api, { load: i => { scene = 'play'; syncScene(); loadLevel(i, false); }, step, press, release });
  Object.defineProperty(api, 'state', { get: () => ({ p, carry, blocks, slimes, arrows, doors, plates, springs, crumbles, timer, mode, levelIdx, scene, lt }) });
  window.__game = api;

  function start(data) {
    buildPlayerFrames();
    levelIdx = Math.min(save.level, LEVELS.length - 1);
    startPreview(0);
    renderBinds();
    fit(); syncScene();
    if (data && typeof data.level === 'number' && data.scene === 'play') { scene = 'play'; syncScene(); loadLevel(data.level, false); }
    requestAnimationFrame(frame);
  }
  window.claude?.hot?.snapshot?.(() => ({ level: levelIdx, scene }));
  const boot = d => (document.fonts && document.fonts.load ? Promise.all([document.fonts.load('8px "Silkscreen"'), document.fonts.load('48px "Jacquard 24"')]).catch(() => {}) : Promise.resolve()).then(() => start(d));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
